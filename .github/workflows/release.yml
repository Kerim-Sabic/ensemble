name: Release

# Push a tag such as v3.4.1 and this builds the Windows installer and publishes it as a
# GitHub release. Installed copies of Ensemble find it and update themselves.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Build the installer
        run: node scripts/build-hands.mjs && pnpm exec electron-vite build && pnpm exec electron-builder --win --publish never
      # Published here in one step rather than by electron-builder: it uploads its files in
      # parallel, and each upload can create its own copy of a release that doesn't exist yet.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
          files="dist/Ensemble-Setup-$version.exe dist/Ensemble-Setup-$version.exe.blockmap dist/latest.yml"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            gh release create "$tag" $files --title "Ensemble $version" --generate-notes
          fi
