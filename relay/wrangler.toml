# Ensemble's relay, on your own Cloudflare account (see README.md). Free plan.
name = "ensemble-relay"
main = "worker.ts"
compatibility_date = "2026-11-01"

# The phone page, its tunnel script, service worker and icon are served by the relay itself.
rules = [
  { type = "Text", globs = ["**/*.html", "**/*.js"], fallthrough = true },
  { type = "Data", globs = ["**/*.png"], fallthrough = true },
]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = false
