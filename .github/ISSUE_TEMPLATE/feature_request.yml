name: An idea
description: Something Ensemble should do, or do better
labels: [idea]
body:
  - type: textarea
    id: job
    attributes:
      label: What you were trying to get done
      description: The job, in your own words. What did you try, and where did Ensemble get in the way or fall short?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Rough is fine.
  - type: dropdown
    id: accounts
    attributes:
      label: Accounts on your team
      options:
        - Claude only
        - ChatGPT only
        - Claude and ChatGPT
        - Not using it yet
